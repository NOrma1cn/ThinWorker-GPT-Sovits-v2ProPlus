[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thin-tts-server"
version = "1.1.0"
description = "GPT-SoVITS v2ProPlus streaming TTS inference server (inference-only, Chinese)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
authors = [{ name = "NOrma1cn" }]
keywords = ["tts", "gpt-sovits", "streaming", "triton", "cuda"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.30,<5",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "pypinyin>=0.50",
    "jieba-fast>=0.4",
    "cn2an>=0.5",
    "onnxruntime-gpu==1.23.2",
    "opencc>=1.1",
    "requests>=2.28",
    "einops>=0.6",
    "fast-langdetect>=1.0",
    "split-lang>=2.0",
    "packaging>=23.0",
    "pydantic>=2.0",
    "torchmetrics>=1.0,<2",
    "textual>=5,<6",
    "rich>=13.3,<14",
    "ruamel.yaml>=0.18.17,<0.20",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "build"]

[project.scripts]
thin-tts-server = "thin_tts.cli:main"

[project.urls]
Repository = "https://github.com/NOrma1cn/ThinWorker-GPT-Sovits-v2ProPlus"
Changelog = "https://github.com/NOrma1cn/ThinWorker-GPT-Sovits-v2ProPlus/blob/main/CHANGES.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thin_tts.text" = ["opencpop-strict.txt"]
"thin_tts.text.g2pw" = ["*.rep", "*.pickle"]
